# Builds apps/portfolio (Astro) and deploys it to Cloudflare Pages.
#   push to main   → production (https://agustinoberg-portfolio.pages.dev, later the final domain)
#   pull request   → preview deployment with its own URL
#
# Needs, in GitHub → Settings → Secrets and variables → Actions:
#   secrets.CLOUDFLARE_API_TOKEN   API token with "Cloudflare Pages: Edit" on the account (same as design)
#   secrets.CLOUDFLARE_ACCOUNT_ID  the Cloudflare account ID (same as design)
#   vars.PORTFOLIO_SITE_URL (optional)  public URL without trailing slash; overrides apps/portfolio/.env
# Without the secrets, the build still runs as a check and the deploy is skipped.

name: Deploy portfolio

on:
  push:
    branches: [main]
    paths:
      - "apps/portfolio/**"
      - "packages/brand/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/deploy-portfolio.yml"
  pull_request:
    paths:
      - "apps/portfolio/**"
      - "packages/brand/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-portfolio.yml"
  workflow_dispatch:

concurrency:
  group: deploy-portfolio-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

env:
  PAGES_PROJECT: agustinoberg-portfolio

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          SITE_URL: ${{ vars.PORTFOLIO_SITE_URL }}
        run: |
          # Only override apps/portfolio/.env when the repo variable is set.
          if [ -n "$SITE_URL" ]; then export PUBLIC_SITE_URL="$SITE_URL"; fi
          pnpm turbo run build --filter=portfolio

      - name: Skip deploy (no Cloudflare secrets)
        if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::notice::Built apps/portfolio. Deploy skipped because CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID isn't set."

      - name: Create the Pages project if it doesn't exist
        if: env.HAS_CLOUDFLARE == 'true'
        working-directory: apps/portfolio
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if pnpm exec wrangler pages project list | grep -qw "$PAGES_PROJECT"; then
            echo "Pages project $PAGES_PROJECT exists."
          else
            pnpm exec wrangler pages project create "$PAGES_PROJECT" --production-branch=main
          fi

      - name: Deploy to Cloudflare Pages
        if: env.HAS_CLOUDFLARE == 'true'
        id: deploy
        working-directory: apps/portfolio
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.event.pull_request.title }}
        run: |
          pnpm exec wrangler pages deploy dist \
            --project-name="$PAGES_PROJECT" \
            --branch="$BRANCH" \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="$(printf '%s' "$COMMIT_MESSAGE" | head -n 1)" \
            --commit-dirty=true
